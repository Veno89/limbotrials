[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/api/leaderboard"
  to = "/.netlify/functions/submit-run"
  status = 200
  force = true

[[redirects]]
  from = "/api/leaderboard/"
  to = "/.netlify/functions/submit-run"
  status = 200
  force = true

[[redirects]]
  from = "/api/runs"
  to = "/.netlify/functions/submit-run"
  status = 200
  force = true

[[redirects]]
  from = "/api/runs/"
  to = "/.netlify/functions/submit-run"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
