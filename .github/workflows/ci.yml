name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source, content, diagnostics, tests, and production bundle
        run: npm run verify

      - name: Exercise the development-tool browser flow
        run: npm run smoke:dev

      - name: Exercise the production browser flow
        run: npm run smoke:prod

      - name: Retain browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: .smoke
          if-no-files-found: ignore
